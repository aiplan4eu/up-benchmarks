[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-planning-benchmarks"
version = "0.1.0"
description = "A collection of planning problems"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "unified-planning",
    "ConfigSpace",
    "pyyaml",
    "sympy"
]

[dependency-groups]
dev = [
    "pytest",
    "black==22.6.0",
    "mypy",
    "pre-commit",
    "types-PyYAML",
    "up-tamer",
    "tamerlite[rust]",
]

[tool.uv.sources]
unified-planning = { git = "https://github.com/aiplan4eu/unified-planning", branch = "master" }

[tool.setuptools.packages.find]
include = ["upbm*"]

[tool.setuptools.package-data]
"*" = ["*.pddl"]

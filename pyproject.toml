[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-planning-benchmarks"
version = "0.1.0"
description = "A collection of planning problems"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "unified-planning",
    "ConfigSpace",
    "pyyaml",
    "sympy"
]

# Only for working on this repo: tests, type checks, formatting and the
# planners that the tests use. `uv sync` installs them.
[dependency-groups]
dev = [
    "pytest",
    "black==22.6.0",
    "mypy",
    "pre-commit",
    "types-PyYAML",
    "up-tamer",
    "tamerlite[rust]",
]

# Where uv takes packages from, for the development environment only (`pip
# install .` still takes unified-planning from PyPI).
# unified-planning comes from its GitHub master, which is what people using
# this repo usually run, so CI notices when a change there breaks something.
# uv.lock records one master commit; CI moves to the latest on every run
# (`uv sync --upgrade`), locally `uv lock --upgrade` does the same.
[tool.uv.sources]
unified-planning = { git = "https://github.com/aiplan4eu/unified-planning", branch = "master" }

[tool.setuptools.packages.find]
include = ["upbm*"]

[tool.setuptools.package-data]
"*" = ["*.pddl"]

name: test

on: push

jobs:
  static_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: install requirements
        run: |
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      - name: Black check
        run: python3 -m black --check .

      - name: MyPy check
        run: python3 -m mypy .

  test_linux:
    runs-on: ubuntu-latest
    needs: [
      static_analysis,
    ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: install requirements
        run: |
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      - name: run tests
        run: python3 -m pytest upbm

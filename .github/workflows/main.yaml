name: test

on: push

# Both jobs install with `uv sync --upgrade`: instead of the versions recorded in
# uv.lock they take the latest of every dependency, including the latest
# unified-planning master, so CI notices when a new release or a change in
# unified-planning breaks something. The Python version comes from
# .python-version.

jobs:
  static_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --upgrade

      - name: Black check
        run: uv run black --check .

      - name: MyPy check
        run: uv run mypy .

  test_linux:
    runs-on: ubuntu-latest
    needs: [
      static_analysis,
    ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --upgrade

      - name: run tests
        run: uv run pytest upbm

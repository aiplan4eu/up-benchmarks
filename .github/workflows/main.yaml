name: test

on: push

jobs:
  static_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --upgrade

      - name: Format check
        run: uv run ruff format --check .

      - name: MyPy check
        run: uv run mypy .

  test_linux:
    runs-on: ubuntu-latest
    needs: [
      static_analysis,
    ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --upgrade

      - name: run tests
        run: uv run pytest upbm

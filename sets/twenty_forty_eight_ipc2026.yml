# The 20 2048 instances of the IPC 2026 dataset.
#
# Every instance is the same 4x4 board scaffolding under a different starting
# position. The board size is fixed by the domain file, which declares p11..p44
# as :constants, and the pos-at / next / next-idx facts that drive the phase
# machine are identical in all 20 shipped instances - so an instance is only
# its 16 tiles plus the tile the goal asks for.
#
# Tiles are given as exponents: 0 is an empty cell and k stands for 2^k, so
# tile_11: 5 is a 32. Writing them this way makes every board a legal 2048
# board, since no tile can come out as anything but a power of two.
#
# All 16 tiles are listed for every instance on purpose. A tile left out would
# fall back to its default, and the defaults spell out pfile8 rather than an
# empty board.
#
# goal_tile is the value the goal collects into p11, and it must equal the sum
# of the board: shifting only moves tiles and a merge turns two tiles worth v
# into one worth 2v, so the board sum never changes. All 20 shipped instances
# hold to that.
#
# The file names are the length of the solution sequence each shipped file
# records in its header, which is how the instances were made: a random walk
# backwards from the goal. That sequence is not a parameter - it is only how
# the board was drawn - so it is not reproduced here.
domain: "2048"
params:
  version: 1
  variant: ipc
instances:
  # pfile8 - board:
  #    4 |  0 | 32 |  2
  #    4 |  0 |  2 |  0
  #    0 | 32 |  0 |  0
  #   32 |  4 |  0 | 16
  - name: "pfile8"
    params:
      goal_tile: 128
      tile_11: 2  # 4
      tile_12: 0  # empty
      tile_13: 5  # 32
      tile_14: 1  # 2
      tile_21: 2  # 4
      tile_22: 0  # empty
      tile_23: 1  # 2
      tile_24: 0  # empty
      tile_31: 0  # empty
      tile_32: 5  # 32
      tile_33: 0  # empty
      tile_34: 0  # empty
      tile_41: 5  # 32
      tile_42: 2  # 4
      tile_43: 0  # empty
      tile_44: 4  # 16

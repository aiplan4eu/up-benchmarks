# The 20 onlycraft instances of the optimal track of the IPC 2026 dataset.
# n_cells and n_pogo_sticks are the only things that change; the number of
# trees follows from n_pogo_sticks, see n_trees_for() in the generator.
domain: onlycraft
params:
  version: 1
  variant: ipc
instances:
  - name: P01_opt
    params:
      n_cells: 9
      n_pogo_sticks: 1

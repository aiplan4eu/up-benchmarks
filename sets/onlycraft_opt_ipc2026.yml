# The 20 onlycraft instances of the optimal track of the IPC 2026 dataset
# (ipc2026-dataset/onlycraft-opt).
#
# The `ipc` variant rebuilds the shipped instances exactly, so the only thing
# an instance chooses is which one: `index` is the position of the file in
# name order, opt track first, so P01_opt is 1 and P20_opt is 20 (the sat
# track is 21-40). Which cells are trees, where the crafting table stands and
# where the start is live in
# upbm/domains/onlycraft/resources/ipc_onlycraft_data.py, because the shipped
# files scatter them with no rule to rebuild them from.
domain: onlycraft
params:
  version: 1
  variant: ipc
instances:
  - name: P01_opt
    # 9 cells, 1 pogo stick
    params:
      index: 1
  - name: P02_opt
    # 9 cells, 2 pogo sticks
    params:
      index: 2
  - name: P03_opt
    # 16 cells, 3 pogo sticks
    params:

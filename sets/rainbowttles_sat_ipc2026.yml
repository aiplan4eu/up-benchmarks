# The 20 rainbowttles instances of the IPC 2026 satisficing track
# (ipc2026-dataset/rainbowttles-sat).
#
# The `ipc` variant rebuilds the shipped puzzles instead of drawing its own, so
# the only thing an instance chooses is which one: `index` is the number in the
# file name. The bottles themselves live in
# upbm/domains/rainbowttles/resources/ipc_rainbowttles_data.py, because a
# scrambled puzzle is a state, not a handful of numbers.
domain: rainbowttles
params:
  version: 1
  variant: ipc
instances:
  - name: p31
    # 5 colours, 7 bottles
    params:
      index: 31

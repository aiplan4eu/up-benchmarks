# The 20 sailing-wind instances of the IPC 2026 optimal track
# (ipc2026-dataset/sailing-wind-opt).
#
# The boat always starts stopped at the origin and keeps half its speed when it
# turns. That is the `inertia` parameter, given as a whole percentage, so the
# r = 0.5 of this track is written here as 50; every instance of the track uses
# the same value. The single person to rescue sits on a diagonal ramp, whose
# position k is (5 + 0.4 k, 15.5 + 0.4 k); `skip` is how many positions are
# passed over before that person, and is the only thing that changes. `gap`
# only matters with two or more people.
#
# The variant is named after that ramp rather than after the IPC track: the
# inertia is no longer what tells the two layouts apart, so `line` and `circle`
# say what the generator actually does.
domain: sailing-wind
params:
  version: 1
  variant: line
instances:
  - name: problem_0
    params:
      n_people: 1
      skip: 0
      gap: 0
      inertia: 50
  - name: problem_1
    params:
      n_people: 1
      skip: 1
      gap: 0
      inertia: 50

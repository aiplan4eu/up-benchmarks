# The 20 line-exchange-snp instances of the IPC 2026 dataset, by index.
#
# The same twenty problems as line_exchange_snp_ipc2026.yml, reached the other
# way round. That file uses the "bounded_5" variant and spells out every
# starting load; this one uses the "ipc" variant, whose whole parameter space is
# an index into the table in
# upbm/domains/line_exchange_snp/resources/ipc_line_exchange_snp_data.py.
#
# Both files generate byte-identical problems - test_both_ipc_sets_agree pins
# that - so which one to prefer is a question of what you want to say:
#
#   this file   "give me shipped instance N", where n_robots, D and the loads
#               are all fixed dataset facts and there is nothing to get wrong
#   the other   "give me these loads on this line", which happens to be set to
#               the shipped values here but can be pointed anywhere
#
# Each entry is still named after its original file, whose name encodes
# <n_robots>_<mean_q>_<imbalance%>_<D>. The index is the position in the table,
# which is the order the dataset lists the files in.
domain: line-exchange-snp
params:
  version: 1
  variant: ipc
instances:
  # 3 robots, D=10, loads [12, 12, 6]  (mean_q=10, imbalance=50%)
  - name: "3_10_50_10"
    params:
      index: 0
  # 3 robots, D=50, loads [10, 9, 11]  (mean_q=10, imbalance=90%)
  - name: "3_10_90_50"
    params:
      index: 1
  # 3 robots, D=100, loads [14, 19, 12]  (mean_q=15, imbalance=25%)
  - name: "3_15_25_100"
    params:
      index: 2
  # 3 robots, D=10, loads [35, 6, 4]  (mean_q=15, imbalance=90%)
  - name: "3_15_90_10"
    params:
      index: 3
  # 3 robots, D=50, loads [3, 6, 6]  (mean_q=5, imbalance=50%)
  - name: "3_5_50_50"
    params:
      index: 4
  # 3 robots, D=100, loads [3, 3, 9]  (mean_q=5, imbalance=90%)
  - name: "3_5_90_100"
    params:
      index: 5
  # 4 robots, D=10, loads [11, 12, 8, 9]  (mean_q=10, imbalance=25%)
  - name: "4_10_25_10"
    params:
      index: 6
  # 4 robots, D=50, loads [13, 9, 5, 13]  (mean_q=10, imbalance=50%)
  - name: "4_10_50_50"
    params:

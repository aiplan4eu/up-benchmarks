# The 20 sailing-wind instances of the IPC 2026 satisficing track
# (ipc2026-dataset/sailing-wind-sat).
#
# The boat keeps 90% of its speed when it turns, which makes stopping next to a
# person much harder than in the optimal track. That is the `inertia` parameter,
# given as a whole percentage, so the r = 0.9 of this track is written here as
# 90; every instance of the track uses the same value.
#
# Every person waits on a circle of radius 100 around the boat, at a multiple
# of 45 degrees; direction i means 45 * i degrees, so 0 is due east and 2 is
# due north. A direction_1 of -1 means the instance has a single person.
#
# The variant is named after that circle rather than after the IPC track: the
# inertia is no longer what tells the two layouts apart, so `line` and `circle`
# say what the generator actually does.
domain: sailing-wind
params:
  version: 1
  variant: circle
instances:
  # 90 degrees
  - name: problem_0
    params:
      direction_0: 2
      direction_1: -1
      inertia: 90
  # 45 degrees
  - name: problem_1
    params:
      direction_0: 1
      direction_1: -1
      inertia: 90
  # 0 degrees
  - name: problem_2
    params:
      direction_0: 0
      direction_1: -1
      inertia: 90
  # 315 degrees
  - name: problem_3
    params:
      direction_0: 7
      direction_1: -1
      inertia: 90
  # 270 degrees
  - name: problem_4
    params:
      direction_0: 6
      direction_1: -1
      inertia: 90
  # 45 degrees and 315 degrees
  - name: problem_5
    params:
      direction_0: 1
      direction_1: 7
      inertia: 90
  # 45 degrees and 270 degrees
  - name: problem_6
    params:
      direction_0: 1
      direction_1: 6
      inertia: 90
  # 45 degrees and 225 degrees
  - name: problem_7
    params:
      direction_0: 1
      direction_1: 5
      inertia: 90
  # 45 degrees and 180 degrees
  - name: problem_8
    params:
      direction_0: 1
      direction_1: 4
      inertia: 90
  # 45 degrees and 135 degrees
  - name: problem_9
    params:
      direction_0: 1
      direction_1: 3
      inertia: 90
  # 0 degrees and 315 degrees
  - name: problem_10
    params:
      direction_0: 0
      direction_1: 7
      inertia: 90
  # 0 degrees and 270 degrees
  - name: problem_11
    params:
      direction_0: 0
      direction_1: 6
      inertia: 90
  # 0 degrees and 225 degrees
  - name: problem_12
    params:
      direction_0: 0
      direction_1: 5
      inertia: 90
  # 0 degrees and 180 degrees
  - name: problem_13
    params:
      direction_0: 0
      direction_1: 4
      inertia: 90
  # 315 degrees and 270 degrees
  - name: problem_14
    params:
      direction_0: 7
      direction_1: 6
      inertia: 90
  # 315 degrees and 225 degrees
  - name: problem_15
    params:
      direction_0: 7
      direction_1: 5
      inertia: 90
  # 90 degrees and 45 degrees
  - name: problem_16
    params:
      direction_0: 2
      direction_1: 1
      inertia: 90
  # 90 degrees and 0 degrees
  - name: problem_17
    params:
      direction_0: 2
      direction_1: 0
      inertia: 90
  # 90 degrees and 315 degrees
  - name: problem_18
    params:
      direction_0: 2
      direction_1: 7
      inertia: 90
  # 90 degrees and 270 degrees
  - name: problem_19
    params:
      direction_0: 2
      direction_1: 6
      inertia: 90

# The 20 factory-robot instances of the IPC 2026 dataset
# (ipc2026-dataset/factory-robot).
#
# The `ipc` variant rebuilds the shipped instances, so the only thing an
# instance chooses is which one: `index` is the number in the file name. The
# robots, stations and goals live in
# upbm/domains/factory_robot/resources/ipc_factory_robot_data.py.
#
# pfile1 and pfile2 are byte-identical in the dataset, so they are listed
# twice here on purpose.
domain: factory-robot
params:
  version: 1
  variant: ipc
instances:
  - name: pfile1
    # 2 robots, 5 stations
    params:
      index: 1
  - name: pfile2
    # 2 robots, 5 stations
    params:
      index: 2
  - name: pfile3
    # 3 robots, 6 stations
    params:
      index: 3
  - name: pfile4
    # 3 robots, 6 stations

# The 20 factory-robot instances of the IPC 2026 dataset.
#
# Every shipped instance records the exact call that produced it, e.g.
#   ;; Generated by: python generate.py --robots 6 --stations 9 --workload 70 \
#      --max-temp 30 --seed 42
# so these five parameters ARE the generator's interface, and this file is
# simply those 20 calls. The script itself was never published; it was
# reconstructed from the instances (see the docstring of `draw` in
# upbm/domains/factory_robot/factory_robot.py) and reproduces all 20 exactly.
#
# Everything else about an instance follows from these five numbers: the
# stations form a full clique, the charger is on `charging` and the calibrator
# on `cooling`, every station nobody stands on is free, and all robots start
# calibrated with workload, temperature and production at 0.
#
# The seed is 42 in all 20 - it is a parameter because the original CLI has
# one, not because the set varies it. The sizes are n_stations = n_robots + 3
# except the largest pair, which is 12 robots and 14 stations.
#
# NOTE pfile1 and pfile2 are byte-identical in the dataset - the same call
# twice - so they are listed twice here on purpose.
domain: factory-robot
params:
  version: 1
  variant: ipc
instances:
  - name: pfile1
    params:
      n_robots: 2
      n_stations: 5
      workload: 40
      max_temp: 20
      seed: 42
  - name: pfile2
    params:
      n_robots: 2
      n_stations: 5
      workload: 40
      max_temp: 20
      seed: 42

# The 20 onlycraft instances of the satisficing track of the IPC 2026 dataset
# (ipc2026-dataset/onlycraft-sat).
#
# These rebuild the shipped instances only up to which cell is which: the
# sizes and the goal are the same, but the generator lays the cells out in
# order (trees first, then air) and puts the start and the crafting table on
# cell0, where the shipped files scatter them. No action reads which cell is
# which, so no plan can tell the difference.
#
# Every shipped instance has (7k + 1) // 2 trees for k pogo sticks, so
# extra_trees is that minus the fewest trees k pogo sticks need, and there
# are no low trees.
domain: onlycraft
params:
  version: 1
  variant: generic
instances:
  - name: P01_sat
    # 9 cells, 4 of them trees
    params:
      n_pogo_sticks: 1
      extra_trees: 3
      n_low_trees: 0
      n_air_cells: 5
  - name: P02_sat
    # 9 cells, 7 of them trees
    params:
      n_pogo_sticks: 2
      extra_trees: 3
      n_low_trees: 0
      n_air_cells: 2

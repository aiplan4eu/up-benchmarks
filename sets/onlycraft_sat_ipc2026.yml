# The 20 onlycraft instances of the satisficing track of the IPC 2026 dataset
# (ipc2026-dataset/onlycraft-sat).
#
# The `ipc` variant rebuilds the shipped instances exactly, so the only thing
# an instance chooses is which one: `index` is the position of the file in
# name order, opt track first, so P01_sat is 21 and P20_sat is 40 (the opt
# track is 1-20). Which cells are trees, where the crafting table stands and
# where the start is live in
# upbm/domains/onlycraft/resources/ipc_onlycraft_data.py, because the shipped
# files scatter them with no rule to rebuild them from.
domain: onlycraft
params:
  version: 1
  variant: ipc
instances:
  - name: P01_sat
    # 9 cells, 1 pogo stick
    params:
      index: 21
  - name: P02_sat
    # 9 cells, 2 pogo sticks
    params:
      index: 22
  - name: P03_sat
    # 16 cells, 3 pogo sticks

# The 20 gear-car instances of the IPC 2026 dataset.
#
# The car itself is not a parameter: the speed band, acceleration limits and
# the three fuel tables of each gear all follow from n_gears, and every shipped
# instance agrees on max_acceleration 2, min_acceleration -1 and acc_step 1.
# What changes is how many gears the car has, how far it must go, how much fuel
# it carries, and the two price coefficients of (:metric minimize (cost)).
#
# alpha is a big-M that makes elapsed time dominate fuel in the metric: in 19 of
# the 20 instances alpha = beta * (fuel + 1). p000 is the exception - a warm-up
# copied from p01 that kept p01's alpha and beta while its fuel was lowered - so
# alpha is stated per instance rather than derived.
domain: gear-car
params:
  version: 1
  variant: ipc
instances:
  - name: p000
    params:
      n_gears: 2
      target_distance: 50
      fuel: 200
      alpha: 19536
      beta: 48

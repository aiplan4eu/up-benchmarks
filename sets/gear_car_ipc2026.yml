# The 20 gear-car instances of the IPC 2026 dataset (ipc2026-dataset/gear-car).
#
# Every shipped instance is built from parameters: the car comes from
# n_gears, the goal window is [target_distance, target_distance + 2], and alpha
# is beta * (fuel + 1). The one exception is p000, a warm-up copied from p01
# that kept p01's alpha while its fuel was lowered, so it sets alpha explicitly.
domain: gear-car
params:
  version: 1
  variant: ipc
instances:
  - name: p000
    params:
      n_gears: 2
      target_distance: 50
      fuel: 200
      beta: 48
      alpha: 19536

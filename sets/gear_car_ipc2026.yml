# The 20 gear-car instances of the IPC 2026 dataset (ipc2026-dataset/gear-car).
#
# The `ipc` variant rebuilds the shipped instances instead of building its own
# car, so the only thing an instance chooses is which one: `index` is the number
# in the file name. The cars, distances, fuel and metric prices live in
# upbm/domains/gear_car/resources/ipc_gear_car_data.py.
domain: gear-car
params:
  version: 1
  variant: ipc
instances:
  - name: p000
    # 2 gears, distance 50
    params:
      index: 0

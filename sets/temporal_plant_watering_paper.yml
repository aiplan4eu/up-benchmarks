# The 20 instances distributed with the temporal plant watering domain, named
# after their original problem files. All of them have two agents and the pump
# at (4, 4), and they come in three blocks:
#   pfile1-5:   the grid grows from 10x10 to 14x14, one plant needing 1 unit;
#   pfile6-10:  15x15 grid, one plant needing 1 to 5 units;
#   pfile11-20: 15x15 grid, 2 to 11 plants needing 3 units each.
domain: temporal-plant-watering
params:
  version: 1
  variant: border
instances:
  - name: pfile1
    params:
      size: 10
      n_plants: 1
      pour: 1
      n_agents: 2
      tap_x: 4
      tap_y: 4
  - name: pfile2
    params:
      size: 11
      n_plants: 1
      pour: 1
      n_agents: 2
      tap_x: 4

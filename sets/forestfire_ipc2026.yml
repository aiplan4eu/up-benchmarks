# The 20 forestfire instances of the IPC 2026 dataset.
#
# This set uses the `ipc` variant, which exists to reproduce these 20 files.
# For new instances use the `random` variant instead - it is the default, and
# it draws the fires from a range plus a seed rather than needing one
# parameter per burning cell.
#
# Everything except the fires follows one layout rule, verified across all 20:
# a width x height grid, fully connected to its four neighbours both ways; row
# 2 is bushes apart from the middle column, which is grass and carries a tree;
# max-water is 1 on every bushes cell; ponds sit in both top corners; and the
# bot and the axe both start on the top-left one. So an instance is its grid,
# four numbers, and its fires.
#
# `tree_amount` against `durability` is the difficulty dial. At 3 against 3 the
# gate tree can be chopped once and the middle column is open for good; at 6
# against 3 it cannot be chopped at all, so every drop of water has to cross a
# bushes cell, and leaving one needs has-water <= 1 - a single unit per trip.
#
# `fire_spread` picks which columns of a burning row are alight, and the four
# values are nested:
##   0  far corner
#   1  both corners
#   2  corners and middle
#   3  whole row
#
# `fire_NN` slots are read in the order the fire region is walked - top burning
# row first, then left to right. Slots past the end of the region are ignored,
# so each instance lists only the ones it uses.
#
# `layout_quirk` covers the two one-off deviations: 1 is prob12's second tree
# below the gate, 2 is prob15's row of trees across row 5. They are stated as
# data in the generator rather than as parameters, because exactly one instance
# each would ever use them.
domain: forestfire
params:
  version: 1
  variant: ipc
instances:
  # prob01 - 3x3, far corner of the last row
  #    .  .  .
  #    .  .  .
  #    .  .  5
  - name: "prob01"
    params:
      width: 3
      height: 3
      water_capacity: 3
      durability: 3
      tree_amount: 3
      n_bots: 1
      n_axes: 1
      fire_rows: 1
      fire_spread: 0
      layout_quirk: 0
      fire_00: 5
  # prob02 - 3x3, both corners of the last row
  #    .  .  .
  #    .  .  .
  #    3  .  3
  - name: "prob02"

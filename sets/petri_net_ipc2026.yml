# The 20 petri-net instances of the IPC 2026 dataset.
#
# One parameter per instance: the index, the position of the shipped file in
# name order (prob06-1 is 1, prob10-4 is 20). Its net, goal shape and goal
# numbers are transcribed into
# upbm/domains/petri_net/resources/ipc_petri_net_data.py.
#
# The 20 files are only 3 distinct nets: the :init blocks of prob06 and prob08
# are identical, as are those of prob09 and prob10, and prob07 is its own. The
# generator builds them:
#
#   net 0  prob06 / prob08  26 places, three branches of eight that recycle
#                           tokens back into their hub
#   net 1  prob07           18 places, two branches with a sink and a place
#                           that doubles its own tokens
#   net 2  prob09 / prob10  13 places, three short branches funnelling into a
#                           shared pair of places
#
# What varies is only the goal: how many tokens K the goal place g must hold,
# and one condition, asking for an amount N, on a few other places:
#
#   prob06  each of a4, b4, c4 holds N
#   prob08  a7 + b7 + c7 >= N
#   prob07  p5 and q5 hold N, and nothing is left in p2..p4 or q2..q4
#   prob09  a3 + b3 + c3 = N
#   prob10  each of a3, b3, c3 holds N
#
# Every place starts empty in all 20 instances.
domain: petri-net
params:
  version: 1
  variant: ipc
instances:
  - name: "prob06-1"
    # net 0, K = 3, N = 2
    params:
      index: 1
  - name: "prob06-2"
    # net 0, K = 2, N = 2
    params:
      index: 2
  - name: "prob06-3"
    # net 0, K = 3, N = 1
    params:
      index: 3
  - name: "prob06-4"
    # net 0, K = 2, N = 1
    params:
      index: 4
  - name: "prob07-1"
    # net 1, K = 3, N = 2
    params:
      index: 5
  - name: "prob07-2"
    # net 1, K = 3, N = 1
    params:
      index: 6
  - name: "prob07-3"
    # net 1, K = 2, N = 1
    params:
      index: 7
  - name: "prob07-4"
    # net 1, K = 1, N = 1
    params:
      index: 8
  - name: "prob08-1"
    # net 0, K = 3, N = 3
    params:
      index: 9
  - name: "prob08-2"
    # net 0, K = 2, N = 3
    params:
      index: 10
  - name: "prob08-3"
    # net 0, K = 3, N = 1
    params:
      index: 11
  - name: "prob08-4"
    # net 0, K = 2, N = 2
    params:
      index: 12
  - name: "prob09-1"
    # net 2, K = 5, N = 1
    params:
      index: 13
  - name: "prob09-2"
    # net 2, K = 4, N = 1
    params:
      index: 14
  - name: "prob09-3"
    # net 2, K = 3, N = 1
    params:
      index: 15
  - name: "prob09-4"
    # net 2, K = 2, N = 1
    params:
      index: 16
  - name: "prob10-1"
    # net 2, K = 5, N = 0
    params:
      index: 17
  - name: "prob10-2"
    # net 2, K = 4, N = 0
    params:
      index: 18
  - name: "prob10-3"
    # net 2, K = 3, N = 0
    params:
      index: 19
  - name: "prob10-4"
    # net 2, K = 2, N = 0
    params:
      index: 20
